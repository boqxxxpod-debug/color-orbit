<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101827">
  <title>COLOR ORBIT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-live="polite">
    <header class="topbar">
      <button class="icon-button" id="levelsButton" aria-label="レベル選択">☷</button>
      <div class="brand"><h1>COLOR ORBIT</h1><span id="levelLabel">LEVEL 1</span></div>
      <button class="icon-button" id="settingsButton" aria-label="設定">⚙</button>
    </header>

    <section id="gameScreen" class="screen">
      <div class="metrics"><span>MOVES <strong id="moveCount">0</strong></span><span>BEST <strong id="bestMoves">—</strong></span></div>
      <div id="boardWrap" class="board-wrap">
        <svg id="board" viewBox="0 0 360 360" role="group" aria-label="同心円パズル盤面"></svg>
        <div id="clearPulse" class="clear-pulse">CLEAR!</div>
      </div>
      <p id="levelHint" class="hint"></p>
      <div class="controls"><button id="undoButton">↶ UNDO</button><button id="resetButton">↻ RESET</button></div>
    </section>

    <section id="levelScreen" class="screen panel-screen hidden">
      <div class="panel-heading"><h2>LEVEL SELECT</h2><button class="close-button" data-close>×</button></div>
      <div id="levelGrid" class="level-grid"></div>
    </section>

    <section id="settingsScreen" class="screen panel-screen hidden">
      <div class="panel-heading"><h2>SETTINGS</h2><button class="close-button" data-close>×</button></div>
      <label class="setting-row"><span>Sound<small>操作音とクリア音</small></span><input id="soundToggle" type="checkbox" role="switch"></label>
      <label class="setting-row"><span>Color Help<small>色に記号を表示</small></span><input id="colorHelpToggle" type="checkbox" role="switch"></label>
    </section>

    <div id="clearDialog" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="clearTitle">
      <div class="modal-card"><p class="eyebrow">ORBIT ALIGNED</p><h2 id="clearTitle">CLEAR!</h2><div id="stars" class="stars"></div><p id="clearStats"></p>
        <button id="nextButton" class="primary">NEXT LEVEL</button><button id="retryButton">RETRY</button><button id="selectButton" class="text-button">LEVEL SELECT</button>
      </div>
    </div>
  </main>
  <script src="levels.js"></script><script src="storage.js"></script><script src="solver.js"></script><script src="game.js"></script>
</body>
</html>
